    <marker id="rs-arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2c7658"/>
    </marker>
    <marker id="rs-arch-arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7fb59c"/>
    </marker>
    <filter id="rs-arch-shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1f4d3a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="#f4faf7"/>
