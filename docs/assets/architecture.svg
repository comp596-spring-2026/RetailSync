<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="rs-arch-t rs-arch-d">
  <title id="rs-arch-t">RetailSync architecture</title>
  <desc id="rs-arch-d">RetailSync components: a React client calls the Express API over HTTPS with JWT auth and uploads statement PDFs to Google Cloud Storage with signed URLs. The API stores data in MongoDB, runs the statement pipeline inline or through Cloud Tasks, and talks to Google Sheets, QuickBooks Online, Google Vision/Gemini and SMTP. A shared TypeScript package holds the Zod schemas. GitHub Actions deploys the API to Cloud Run and the client to Firebase Hosting.</desc>
