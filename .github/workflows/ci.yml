name: CI

on:
  pull_request:
    branches:
      - development
      - production

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Run server tests
        working-directory: ./server
        run: pnpm test

      - name: Run server auth regression tests
        working-directory: ./server
        run: pnpm exec vitest run src/authController.test.ts src/auth.google.test.ts src/auth.email.test.ts

      - name: Run client tests
        working-directory: ./client
        run: pnpm test

      - name: Run client auth regression tests
        working-directory: ./client
        run: pnpm exec vitest run src/modules/auth/api/AuthApi.test.ts src/modules/auth/pages/LoginPage.test.tsx src/modules/auth/pages/RegisterPage.test.tsx src/modules/auth/pages/ForgotPasswordPage.test.tsx src/modules/auth/pages/ResetPasswordPage.test.tsx src/modules/auth/pages/VerifyEmailPage.test.tsx src/architectureBoundaries.test.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Ensure no JSON key env fallback
        run: |
          if rg -n "GOOGLE_SERVICE_ACCOUNT_JSON|googleServiceAccountJson" .; then
            echo "Found forbidden GOOGLE_SERVICE_ACCOUNT_JSON reference."
            exit 1
          fi
